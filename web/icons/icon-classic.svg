<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="0.45" stop-color="#2f5bea"/>
      <stop offset="1" stop-color="#1b34b0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edff"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16236f"/>
      <stop offset="1" stop-color="#2a47c4"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sheetShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071443" flood-opacity="0.40"/>
    </filter>
    <filter id="bodyShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="-8" stdDeviation="9" flood-color="#071443" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>

  <!-- 纸张：打印出来的页面，链路标记代表 Link -->
  <g filter="url(#sheetShadow)">
    <rect x="150" y="100" width="212" height="170" rx="22" fill="#ffffff"/>
  </g>
  <g transform="translate(256,180) scale(6) translate(-12,-12)"
     fill="none" stroke="#2f5bea" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
  </g>

  <!-- 打印机机身 -->
  <g filter="url(#bodyShadow)">
    <rect x="72" y="262" width="368" height="140" rx="34" fill="url(#body)"/>
  </g>
  <!-- 出纸口 -->
  <rect x="150" y="292" width="212" height="14" rx="7" fill="url(#slot)"/>
  <!-- 指示灯 -->
  <circle cx="386" cy="356" r="8.5" fill="#2f5bea"/>
</svg>
