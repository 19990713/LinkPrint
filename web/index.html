<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LinkPrint 打印系统</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-256.png">
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --line:#e4e8ef; --text:#1f2532; --muted:#6d7686;
    --accent:#2f5bea; --accent-soft:#eaeffe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:13px/1.5 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--card);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  h1{margin:0;font-size:15px;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .folder{color:var(--muted);font-size:12px;max-width:44vw;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .grow{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);
         border-radius:7px;padding:6px 12px;cursor:pointer;transition:.15s}
  button:hover{border-color:#c6cfdd;background:#fafbfd}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 18px}
  button.primary:hover{background:#2549c9}
  button.primary:disabled{background:#b9c4de;border-color:#b9c4de;cursor:not-allowed}
  button.mini{padding:3px 9px;font-size:12px;border-radius:6px}
  button.danger{color:#c62828;border-color:#f0cccc}
  button.danger:hover{background:#fdf3f3;border-color:#e0a5a5}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;
       background:var(--card);border-bottom:1px solid var(--line)}
  .bar label{color:var(--muted);font-size:12px}
  .bar .tag{background:var(--accent-soft);color:var(--accent);font-weight:600;
            padding:3px 9px;border-radius:6px;font-size:12px}
  select,input[type=number]{font:inherit;padding:5px 7px;border:1px solid var(--line);
       border-radius:6px;background:#fff;color:var(--text);outline:none}
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  select:disabled{background:#f3f4f7;color:#8b93a3;border-color:#eef1f6;cursor:not-allowed}
  input[type=number]{width:66px;text-align:center}

  .wrap{padding:0 18px 90px;overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0 6px}
  .wrap table{table-layout:fixed}   /* 定宽 + colgroup，文件列才能拖窄（auto 列宽由内容撑住，缩不动） */
  th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px;white-space:nowrap}
  th.c-file{position:relative}
  th.c-file::after{content:'';position:absolute;top:5px;bottom:5px;right:-4px;width:9px;
                   border-radius:3px;cursor:col-resize}
  th.c-file:hover::after{background:var(--line)}
  td{background:var(--card);padding:7px 10px;border-top:1px solid var(--line);
     border-bottom:1px solid var(--line);white-space:nowrap}
  td:first-child{border-left:1px solid var(--line);border-radius:8px 0 0 8px}
  td:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
  tr.row:hover td{background:#fbfcfe}
  .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  select{max-width:100%}            /* 定宽列里别把下拉框顶出去 */
  /* 缩放：百分比输入框做成单元格第二行，只在该行选「自定义」时出现，不占列宽 */
  .scaleCell .c-scale{font-size:12px;padding:5px 2px}
  .scaleCell .pct{display:none;align-items:center;gap:3px;margin-top:3px;
                  color:var(--muted);font-size:11px}
  .scaleCell.on .pct{display:flex}
  .scaleCell .c-pct{width:52px;padding:3px 4px;font-size:12px}
  .name a{color:var(--text);text-decoration:none;font-weight:500}
  .name a:hover{color:var(--accent);text-decoration:underline}
  .sub{color:var(--muted);font-size:11px;margin-top:1px}
  .sub.sel{color:var(--accent);font-weight:600}
  /* 页码范围：留空 = 全部，写了只打这几页 */
  .c-range{width:100%;padding:4px 5px;font-size:12px;text-align:center}
  .c-range.bad{border-color:#e0a5a5;background:#fdf3f3}
  .badge{display:inline-block;padding:2px 8px;border-radius:5px;background:#eef1f6;
         font-weight:600;font-size:12px}
  .badge.ok{background:var(--accent-soft);color:var(--accent)}
  .mix{color:#b26b00;background:#fff4e0}
  .st{display:inline-block;padding:2px 9px;border-radius:11px;font-size:12px;background:#eef1f6;color:#5a6373}
  .st.doing{background:#e8f0ff;color:#2f5bea}
  .st.done{background:#e6f6ec;color:#17864a}
  .st.err{background:#fdeaea;color:#c62828}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  .footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:14px;
          padding:11px 18px;background:var(--card);border-top:1px solid var(--line);
          box-shadow:0 -2px 12px rgba(30,40,60,.05)}
  .hint{color:var(--muted);font-size:12px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1f2532;color:#fff;
         padding:10px 20px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .toast.bad{background:#c62828}

  .money{font-size:12px;font-weight:600;color:#17864a;background:#e6f6ec;
         padding:3px 9px;border-radius:6px;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(22,28,42,.42);display:none;padding:40px 20px;z-index:100}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:12px;width:100%;max-width:960px;margin:auto;
         display:flex;flex-direction:column;max-height:100%;overflow:hidden;
         box-shadow:0 18px 50px rgba(20,30,60,.25)}
  .mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .mhead b{max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}  /* 长文件名别把标签挤走 */
  .mbody{overflow:auto;padding:0 18px}
  .modal .mbody table{width:100%;border-collapse:collapse;border-spacing:0}
  .modal .mbody th{position:sticky;top:0;background:#fff;z-index:1;padding:8px 6px;
                   border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:500}
  .modal .mbody td{padding:7px 6px;border:0;border-bottom:1px solid var(--line);border-radius:0;
                   background:transparent;font-size:12px;white-space:nowrap}
  .modal .mbody td:first-child{border-left:0;border-radius:0}
  .modal .mbody td:last-child{border-right:0;border-radius:0}
  .modal .mbody tr:hover td{background:#fafbfd}
  .pv-sheet{max-width:1100px;height:100%}
  .pv-body{flex:1;min-height:0;display:flex}
  .pv-sheet iframe{flex:1;width:100%;min-height:0;border:0;background:#f0f2f6;display:none}
  /* 「打印效果」：整张纸渲染成图，看的就是送去打印机那一刻的样子 */
  .pv-effect{flex:1;min-height:0;display:flex;flex-direction:column;background:#eceff5;
             position:relative}
  .pv-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
            padding:18px 22px 8px;overflow:hidden}
  .pv-stage img{max-width:100%;max-height:100%;display:block;background:#fff;
                box-shadow:0 3px 16px rgba(20,30,60,.22);transition:opacity .15s}
  .pv-nav{display:flex;align-items:center;justify-content:center;gap:10px;
          padding:8px 16px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .pv-nav .pg{min-width:96px;text-align:center}
  .pv-tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;
          white-space:nowrap}
  .pv-warn{color:#c2410c;font-weight:600}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:#fff;padding:5px 12px;font-size:12px;
              color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
</style>
</head>
<body>

<header>
  <h1>Link<span>Print</span> 打印系统</h1>
  <div class="folder" id="folder">—</div>
  <button class="mini" onclick="pickFolder()">更换文件夹</button>
  <button class="mini" onclick="openFolder()">打开文件夹</button>
  <div class="grow"></div>
  <button class="mini" onclick="openPvAll()" title="在一个窗口里连续翻看所有文件的每一页">全部预览</button>
  <button class="mini" onclick="openPvMerge()" title="把勾选的文件合并后再多页拼版，预览拼到同一张纸上的效果">拼版预览</button>
  <button onclick="refresh(true)">刷新</button>
  <button class="primary" id="btnAll" onclick="printAll()">全部发出打印</button>
</header>

<div class="bar">
  <span class="tag">默认设置</span>
  <label>打印机</label><select id="dPrinter"></select>
  <label>份数</label><input type="number" id="dCopies" value="1" min="1" max="999">
  <label>色彩</label><select id="dColor"><option value="0">黑白</option><option value="1">彩色</option></select>
  <label>纸张</label><select id="dPaper"></select>
  <label>双面</label>
  <select id="dDuplex">
    <option value="single">单面</option>
    <option value="long">双面·长边翻页</option>
    <option value="short">双面·短边翻页</option>
  </select>
  <label>缩放</label>
  <select id="dScale">
    <option value="fit">适合</option>
    <option value="noscale">实际大小</option>
    <option value="shrink">缩小过大</option>
    <option value="custom">自定义</option>
  </select>
  <input type="number" id="dPct" value="100" min="10" max="400" title="自定义比例，10-400%">
  <span class="hint">%</span>
  <label>每页张数</label>
  <select id="dNup" title="把多页缩印到一张纸上（多页拼版），按纸张数计费">
    <option value="1">1 页</option>
    <option value="2">2 页</option>
    <option value="4">4 页</option>
    <option value="6">6 页</option>
    <option value="9">9 页</option>
    <option value="16">16 页</option>
  </select>
  <button onclick="applyAll()">应用到全部</button>
  <button onclick="applySelected()" title="把上方默认设置套用到当前勾选的文件上">应用到选中的</button>
  <div class="grow"></div>
  <span class="hint" id="stat"></span>
</div>

<div class="wrap">
  <table>
    <colgroup>
      <col style="width:36px"><col id="colFile">
      <col style="width:62px"><col style="width:86px"><col id="colSize" style="width:78px"><col style="width:66px">
      <col id="colPrinter"><col style="width:86px"><col style="width:84px">
      <col style="width:84px"><col style="width:116px"><col style="width:88px"><col style="width:100px"><col style="width:84px"><col><!-- 最后一列吃掉剩余宽度 -->
    </colgroup>
    <thead><tr>
      <th><input type="checkbox" id="chkAll" checked onchange="toggleAll(this.checked)"></th>
      <th class="c-file" title="拖动右边界可调宽">文件</th><th>页数</th>
      <th title="留空打全部；可写 1-3,5 / 5- / -2（倒数第 2 页）">页码范围</th>
      <th>尺寸</th><th>方向</th>
      <th>打印机</th><th>份数</th><th>色彩</th><th>纸张</th><th>双面方式</th><th>缩放</th><th>每页张数</th><th>状态</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    热文件夹里还没有文件。把 PDF / Word / 表格 / PPT / 图片 拖进热文件夹即可自动出现（Office 和图片会自动转成 PDF）。
  </div>
</div>

<div class="footer">
  <span class="hint" id="selInfo">—</span>
  <span class="money" id="mToday">今日 ¥0.00</span>
  <span class="money" id="mTotal">累计 ¥0.00</span>
  <button class="mini" onclick="openLog()">打印记录</button>
  <button class="mini danger" id="btnClear" onclick="clearQueue()"
          title="删除勾选的源文件（进回收站）以及它们的缓存 PDF、合并临时文件">清空队列</button>
  <div class="grow"></div>
  <span class="hint">勾选后一次性发出，队列按顺序送印</span>
  <button class="primary" id="btnMerge" onclick="printAll(true)"
          title="把勾选的文件拼成一份 PDF，一次送印（比逐个发快）。参数不同的会自动分组，各拼一份">合并打印</button>
  <button class="primary" onclick="printAll()">发出打印</button>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="mhead">
      <b>打印记录</b>
      <span class="hint" id="mSum"></span>
      <div class="grow"></div>
      <button class="mini" onclick="clearLog()" title="只清屏幕上的记录和今日/累计，打印记录.csv 不动">清空显示</button>
      <button class="mini" id="btnAllLog" onclick="showAllLog()" style="display:none">显示全部</button>
      <button class="mini" onclick="closeLog()">关闭</button>
    </div>
    <div class="mbody"><table id="logTable"></table></div>
  </div>
</div>

<div class="modal" id="pv">
  <div class="sheet pv-sheet">
    <div class="mhead">
      <b id="pvTitle"></b>
      <span class="hint" id="pvMeta"></span>
      <div class="grow"></div>
      <div class="seg" id="pvTabs">
        <button data-tab="effect" class="on">打印效果</button>
        <button data-tab="raw">原文件</button>
      </div>
      <button class="mini" id="pvTab">新标签打开</button>
      <button class="mini" onclick="closePv()">关闭</button>
    </div>
    <div class="pv-body">
      <div class="pv-effect" id="pvEffect">
        <div class="pv-stage"><img id="pvImg" alt="打印效果预览"></div>
        <div class="pv-nav">
          <button class="mini" id="pvPrev" title="上一页">‹</button>
          <span class="pg" id="pvPage">第 1 页 / 共 1 页</span>
          <button class="mini" id="pvNext" title="下一页">›</button>
          <span class="pv-tag" id="pvPct">—</span>
          <span class="pv-warn" id="pvWarn"></span>
        </div>
      </div>
      <iframe id="pvFrame" title="文件预览"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let CFG = {folder:'', printers:[], papers:[]};
let FILES = [];
let ROWS = {};       // name -> {sel, printer, copies, color, paper, duplex, scale, pct}
let LASTJOB = {};    // name -> job
let PREV = {};       // job id -> 上次看到的状态
let SIG = '';
let DEF = {printer:'', copies:1, color:0, paper:'A4', duplex:'single', scale:'fit', pct:100, nup:1};
let lastSel = -1;    // Shift 连选的锚点：上次点击（或区间起点）在 FILES 里的索引
let shiftClick = false;   // 本次勾选点击是否按住 Shift（mousedown 里记）

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, bad){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.className = 'toast', 2600);
}

function isColorMachine(p){ return /彩|C7580/i.test(p); }

// 黑白机只给「黑白」一项，彩机才给黑白/彩色两个选项
function colorSelect(s){
  if (!isColorMachine(s.printer))
    return `<select class="c-color" disabled><option value="0">黑白</option></select>`;
  return `<select class="c-color">
    <option value="0" ${s.color?'':'selected'}>黑白</option>
    <option value="1" ${s.color?'selected':''}>彩色</option></select>`;
}

function setColorOptions(sel, isColor, val){
  sel.innerHTML = isColor
    ? '<option value="0">黑白</option><option value="1">彩色</option>'
    : '<option value="0">黑白</option>';
  sel.disabled = !isColor;
  sel.value = isColor && val ? '1' : '0';
}

// 默认设置工具条的当前值，新增文件和「应用到全部」都用它
function barValues(){
  return {
    printer: $('#dPrinter').value,
    copies: Math.max(1, parseInt($('#dCopies').value) || 1),
    color: +$('#dColor').value,
    paper: $('#dPaper').value,
    duplex: $('#dDuplex').value,
    scale: $('#dScale').value,
    pct: Math.min(400, Math.max(10, parseInt($('#dPct').value) || 100)),
    nup: +$('#dNup').value || 1
  };
}

// 选彩机就自动带出彩色，选黑白机就自动带出黑白
$('#dPrinter').addEventListener('change', e=>{
  const isC = isColorMachine(e.target.value);
  setColorOptions($('#dColor'), isC, isC ? 1 : 0);
});

async function refresh(fresh){
  const r = await fetch('/api/files').then(r=>r.json());
  const first = !CFG.folder;
  CFG = r;
  $('#folder').textContent = r.folder;
  $('#folder').title = r.folder;

  if (!DEF.printer && r.printers.length) DEF.printer = r.printers[0];
  if (first) fillSelects();
  DEF = barValues();
  FILES = r.files;

  const seen = new Set();
  for (const f of FILES){
    seen.add(f.name);
    if (!ROWS[f.name]){
      ROWS[f.name] = {
        sel:true,
        printer: DEF.printer,
        copies: DEF.copies,
        color: DEF.color,
        paper: f.paper || 'A4',
        duplex: DEF.duplex,
        scale: DEF.scale,
        pct: DEF.pct,
        nup: DEF.nup,
        range: ''          // 页码范围：留空 = 全部页
      };
    }
    const s = ROWS[f.name];
    // 机器/纸张列表变了（比如换打印机），行里存的旧值要回落到合法值
    if (!CFG.printers.includes(s.printer)) s.printer = DEF.printer;
    if (!CFG.papers.includes(s.paper)) s.paper = f.paper || 'A4';
    if (!isColorMachine(s.printer)) s.color = 0;   // 黑白机没有彩色，避免按彩色计价
    if (!(s.scale in {fit:1, shrink:1, noscale:1, custom:1})) s.scale = 'fit';
    s.pct = Math.min(400, Math.max(10, parseInt(s.pct) || 100));
  }
  for (const k of Object.keys(ROWS)) if (!seen.has(k)) delete ROWS[k];
  // 文件没变就只刷状态，别冲掉正在输入的控件；页数/转换状态变了也要重画
  const sg = FILES.map(f=>f.name + '@' + f.mtime + ':' + f.pages + (f.pending ? 'p' : ''))
                   .join('|')
           + '#' + CFG.printers.join(',') + '#' + CFG.papers.join(',');
  if (sg === SIG) paintStatus();
  else { SIG = sg; render(); }
}

// 任务状态 -> 圆点配色。准备中也是「正在忙」，别让它看着像没动
function stCls(st){
  return (st==='打印中'||st==='准备中'||st==='排队中') ? 'doing'
       : st==='完成' ? 'done' : st==='失败' ? 'err' : '';
}

function paintStatus(){
  document.querySelectorAll('#tbody tr.row').forEach(tr=>{
    const j = LASTJOB[tr.dataset.n];
    const st = j ? j.state : '—';
    const el = tr.querySelector('.st');
    el.className = 'st ' + stCls(st);
    el.textContent = st;
    el.title = (j && j.msg) || '';
  });
}

function fillSelects(){
  $('#dPrinter').innerHTML = CFG.printers.map(p=>`<option>${esc(p)}</option>`).join('');
  $('#dPaper').innerHTML = CFG.papers.map(p=>`<option>${p}</option>`).join('');
  $('#dPrinter').value = DEF.printer;
  $('#dPaper').value = 'A4';
  setColorOptions($('#dColor'), isColorMachine(DEF.printer), DEF.color);
}

// ---------------- 页码范围 ----------------
// 规则和 print_system.py 的 parse_pages 一致：空=全部、5、2-6、5-（到末尾）、-1（末页）。
// 前端这份只用来即时算钱和标错，真正送印的页码由后端按真实页数重新解析。
function parsePages(spec, total){
  const s = String(spec || '').trim();
  if (!s) return {list:null, err:''};
  const t = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
             .replace(/[，、；;]/g, ',').replace(/[－—–~～]/g, '-')
             .replace(/\s*-\s*/g, '-').replace(/\s+/g, ',');
  const out = new Set();
  const abs = v => v < 0 ? total + v + 1 : v;      // 负数从末尾数
  for (const tok of t.split(',').filter(Boolean)){
    if (/^(all|全部|全部页|\*)$/i.test(tok)){
      if (!total) return {err:'「全部」要等页数出来'};
      for (let i = 1; i <= total; i++) out.add(i);
      continue;
    }
    let m = /^(-?\d+)$/.exec(tok);
    if (m){
      const v = abs(+m[1]);
      if (v < 1 || (total && v > total))
        return {err:`第 ${m[1]} 页不存在（共 ${total || '?'} 页）`};
      out.add(v); continue;
    }
    m = /^(-?\d+)-(-?\d*)$/.exec(tok);
    if (m){
      let a = abs(+m[1]), b = m[2] === '' ? total : abs(+m[2]);
      if (!b) return {err:`「${tok}」要等页数出来`};
      if (a > b) [a, b] = [b, a];
      if (a < 1 || (total && b > total))
        return {err:`第 ${a}-${b} 页超出范围（共 ${total || '?'} 页）`};
      for (let i = a; i <= b; i++) out.add(i);
      continue;
    }
    return {err:`看不懂的页码：${tok}`};
  }
  if (!out.size) return {err:'没有有效的页码'};
  return {list:[...out].sort((x, y) => x - y), err:''};
}

function pageErr(f, s){ return parsePages(s.range, f.pages || 0); }

// 这一行实际要打几页
function selPages(f, s){
  const r = pageErr(f, s);
  return r.err || !r.list ? (f.pages || 0) : r.list.length;
}

function pagesCell(f, s){
  if (f.pending) return '<b>…</b>';
  const n = selPages(f, s);
  return `<b>${f.pages}</b>` + (n !== f.pages ? `<div class="sub sel">选 ${n} 页</div>` : '');
}

// 尺寸列：可能是「A4」，也可能是「800×1200mm」。badge 撑出单元格时 offsetWidth 仍是真实宽度，
// 量出来按需加宽（只增不减，避免刷新时列宽抖动）。
function fitSizeCol(){
  let w = 0;
  for (const td of document.querySelectorAll('#tbody tr td.c-size'))
    w = Math.max(w, td.firstElementChild ? td.firstElementChild.offsetWidth : td.scrollWidth);
  const col = $('#colSize'), need = w + 20;          // + 单元格左右 padding
  if (need > (parseFloat(col.style.width) || 0)){
    col.style.width = need + 'px';
    // 尺寸列变宽了就把文件列压回去，别让整表顶出容器
    if (FILE_W){ FILE_W = Math.min(FILE_W, roomForFile()); $('#colFile').style.width = FILE_W + 'px'; }
  }
}

// 打印机名长短不定（带 emoji 前缀），按最长选项量一次，别手写死宽度
function fitPrinterCol(){
  const probe = document.createElement('select');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
  probe.innerHTML = CFG.printers.map(p => `<option>${esc(p)}</option>`).join('');
  document.body.appendChild(probe);
  const w = probe.offsetWidth;
  probe.remove();
  if (w) $('#colPrinter').style.width = (w + 22) + 'px';
}

// 文件列：首次按最长文件名定宽（scrollWidth 是被 ellipsis 裁掉后的真实内容宽），之后以拖动为准
let FILE_W = 0;
function colTable(){ return document.querySelector('.wrap table'); }
function fixedCols(){          // 除文件列外所有固定列宽之和
  let s = 0;
  for (const c of colTable().querySelectorAll('colgroup col'))
    if (c.id !== 'colFile' && c.style.width) s += parseFloat(c.style.width);
  return s;
}
function roomForFile(){        // 文件列可用的最大宽：给右侧按钮列留 120
  return Math.max(180, colTable().clientWidth - fixedCols() - 120);
}
function fitFileCol(){
  if (FILE_W) return;
  let w = 0;
  for (const el of document.querySelectorAll('.name')) w = Math.max(w, el.scrollWidth);
  FILE_W = Math.round(Math.max(180, Math.min(w + 26, roomForFile(), innerWidth * .45)));
  $('#colFile').style.width = FILE_W + 'px';
}

// 拖动「文件」列头右边界调宽
$('th.c-file').addEventListener('pointerdown', e => {
  const th = e.currentTarget, x0 = e.clientX, w0 = th.offsetWidth, max = roomForFile();
  th.setPointerCapture(e.pointerId);
  e.preventDefault();
  const mv = ev => {
    FILE_W = Math.round(Math.min(Math.max(160, w0 + ev.clientX - x0), max));
    $('#colFile').style.width = FILE_W + 'px';
  };
  const end = () => th.removeEventListener('pointermove', mv);
  th.addEventListener('pointermove', mv);
  th.addEventListener('pointerup', end, {once: true});
  th.addEventListener('pointercancel', end, {once: true});
});

function amount(f, s){
  const u = (CFG.prices || {})[s.paper + '|' + (s.color ? 1 : 0)] || 0;
  const pages = selPages(f, s);
  const nup = s.nup || 1;
  return u * Math.ceil(pages / nup) * s.copies;
}

function updateStat(){
  const sel = FILES.filter(f=>ROWS[f.name].sel);
  const copies = sel.reduce((a,f)=>a + ROWS[f.name].copies, 0);
  const pages = sel.reduce((a,f)=>a + selPages(f, ROWS[f.name]), 0);
  const money = sel.reduce((a,f)=>a + amount(f, ROWS[f.name]), 0);
  $('#selInfo').textContent =
    `已选 ${sel.length} 个文件 · ${pages} 页 · ${copies} 份 · 本次 ¥${money.toFixed(2)}`;
  $('#stat').textContent = `共 ${FILES.length} 个文件`;
  $('#btnAll').disabled = !sel.length;
  $('#btnMerge').disabled = !sel.length;
  const all = FILES.length && FILES.every(f=>ROWS[f.name].sel);
  $('#chkAll').checked = !!all;
}

// ---------------- 计费记录 ----------------
let LOG = {rows:[], today:0, total:0, count:0};
// 清空显示的时间点：只显示比它新的记录。存在浏览器里，刷新也不会把清掉的又刷回来；
// 后端 打印记录.csv 一个字不动。
let MARK = localStorage.getItem('lp_mark') || '';

// 屏幕上该显示什么（MARK 之后的记录才算）。shortcut: 按秒比较，
// 同一秒里又打完一单会被一起藏掉，等到下一单才看得见
function viewLog(){
  const rows = MARK ? LOG.rows.filter(r => (r['时间']||'') > MARK) : LOG.rows;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const today = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const sum = a => a.reduce((s, r) => s + (parseFloat(r['金额元']) || 0), 0);
  return {rows, count: rows.length,
          today: sum(rows.filter(r => (r['时间']||'').startsWith(today))),
          total: sum(rows)};
}

function paintMoney(){
  const v = viewLog();
  $('#mToday').textContent = '今日 ¥' + v.today.toFixed(2);
  $('#mTotal').textContent = '累计 ¥' + v.total.toFixed(2);
}

async function loadLog(){
  try{
    LOG = await fetch('/api/log').then(r=>r.json());
    paintMoney();
    if ($('#modal').classList.contains('show')) renderLog();
  }catch(e){}
}

function renderLog(){
  const v = viewLog();
  $('#mSum').textContent =
    `共 ${v.count} 单 · 今日 ¥${v.today.toFixed(2)} · 累计 ¥${v.total.toFixed(2)}`;
  $('#btnAllLog').style.display = MARK ? '' : 'none';   // 清空过才给「显示全部」
  if (!v.rows.length){
    $('#logTable').innerHTML = `<tr><td style="padding:36px;text-align:center;color:#6d7686">` +
      `${MARK ? '显示已清空（打印记录.csv 里还在）' : '还没有打印记录'}</td></tr>`;
    return;
  }
  $('#logTable').innerHTML =
    `<thead><tr><th>时间</th><th>文件</th><th>页数</th><th>份数</th><th>纸张</th>
       <th>色彩</th><th>打印机</th><th>单价</th><th>金额</th></tr></thead><tbody>` +
    v.rows.map(r=>`<tr>
      <td>${esc((r['时间']||'').slice(5,16))}</td>
      <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${esc(r['文件']||'')}</td>
      <td>${r['页数']}</td><td>${r['份数']}</td><td>${r['纸张']}</td><td>${r['色彩']}</td>
      <td>${esc(r['打印机']||'')}</td><td>${r['单价元/页']}</td>
      <td><b>¥${r['金额元']}</b></td>
    </tr>`).join('') + '</tbody>';
}

// 清掉屏幕上的记录与今日/累计（CSV 不动）
function clearLog(){
  const newest = (LOG.rows[0] || {})['时间'];
  if (!newest) return toast('本来就没有记录');
  MARK = newest;
  localStorage.setItem('lp_mark', MARK);
  paintMoney(); renderLog();
  toast('屏幕已清空，打印记录.csv 未改动');
}

function showAllLog(){
  MARK = '';
  localStorage.removeItem('lp_mark');
  paintMoney(); renderLog();
  toast('已显示全部记录');
}

function openLog(){ $('#modal').classList.add('show'); renderLog(); loadLog(); }
function closeLog(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e=>{ if (e.target.id === 'modal') closeLog(); });

// 单元格改动
$('#tbody').addEventListener('change', e=>{
  const tr = e.target.closest('tr'); if (!tr) return;
  const s = ROWS[tr.dataset.n]; if (!s) return;
  if (e.target.classList.contains('c-sel')){
    const idx = FILES.findIndex(f => f.name === tr.dataset.n);
    const want = e.target.checked;                 // change 时 checked 已更新为本次点击后的值
    if (shiftClick && lastSel >= 0 && idx >= 0 && idx !== lastSel){
      // 按住 Shift 连选：把 [锚点, 当前] 区间统一设为本框的状态，再整表重画
      const lo = Math.min(lastSel, idx), hi = Math.max(lastSel, idx);
      for (let i = lo; i <= hi; i++) ROWS[FILES[i].name].sel = want;
      render();
      return;
    }
    s.sel = want;
    lastSel = idx;
  }
  else if (e.target.classList.contains('c-printer')){
    s.printer = e.target.value;
    s.color = isColorMachine(s.printer) ? 1 : 0;
    tr.querySelector('.c-color').parentElement.innerHTML = colorSelect(s);  // 黑白机/彩机选项不同，整格重画
  }
  else if (e.target.classList.contains('c-copies')){
    let v = parseInt(e.target.value) || 1;
    v = Math.min(999, Math.max(1, v)); e.target.value = v; s.copies = v;
  }
  else if (e.target.classList.contains('c-color')) s.color = +e.target.value;
  else if (e.target.classList.contains('c-paper')) s.paper = e.target.value;
  else if (e.target.classList.contains('c-duplex')) s.duplex = e.target.value;
  else if (e.target.classList.contains('c-scale')){
    s.scale = e.target.value;
    e.target.closest('td').classList.toggle('on', s.scale === 'custom');  // 只展开本行，不重建表格
  }
  else if (e.target.classList.contains('c-pct')){
    const v = Math.min(400, Math.max(10, parseInt(e.target.value) || 100));
    e.target.value = v; s.pct = v;
  }
  else if (e.target.classList.contains('c-nup')) s.nup = +e.target.value;
  else if (e.target.classList.contains('c-range')){
    s.range = e.target.value.trim();
    const f = FILES.find(x=>x.name === tr.dataset.n) || {pages:0};
    const r = pageErr(f, s);
    e.target.classList.toggle('bad', !!r.err);
    e.target.title = r.err || '留空打全部；可写 1-3,5 / 5- / -2（倒数第 2 页）';
    if (r.err) toast('页码范围：' + r.err, true);
    tr.querySelector('td.c-pages').innerHTML = pagesCell(f, s);   // 只重画页数格，别整表重建
  }
  updateStat();
});

// 点行空白处选中/取消选中：落在有功能的元素上（链接、输入框、下拉框、按钮、勾选框）
// 不触发，其余空白处（td/span/b/div 等）切换该行选中，同样支持 Shift 连选。
$('#tbody').addEventListener('click', e=>{
  const tr = e.target.closest('tr');
  if (!tr) return;
  const act = e.target.dataset.act;
  if (act){                                          // 预览/打印按钮
    if (act === 'pv') openPv(tr.dataset.n);
    else if (act === 'one') send([tr.dataset.n]);
    return;
  }
  // 落在功能元素上不动（勾选框走原生 change，链接跳转，输入框/下拉框各自编辑）
  if (e.target.closest('a, input, select, button')) return;
  const idx = FILES.findIndex(f => f.name === tr.dataset.n);
  if (idx < 0) return;
  const want = !ROWS[tr.dataset.n].sel;
  if (e.shiftKey && lastSel >= 0 && idx !== lastSel){
    const lo = Math.min(lastSel, idx), hi = Math.max(lastSel, idx);
    for (let i = lo; i <= hi; i++) ROWS[FILES[i].name].sel = want;
  } else {
    ROWS[tr.dataset.n].sel = want;
    lastSel = idx;
  }
  render();
});

// Shift 连选：在 mousedown 里记下「这次点击是否按住 Shift」，change 里再据此连选。
// 单选仍走浏览器原生的勾选 → change 事件，绝不失效。
$('#tbody').addEventListener('mousedown', e=>{
  const box = e.target.closest('input.c-sel');
  if (!box) return;
  shiftClick = e.shiftKey;
});

// ---------------- 预览 ----------------
// 「打印效果」：后端按这一行的纸张/缩放/色彩把整张纸渲染成 PNG，和 Acrobat 打印
// 对话框右边那格一个用途 —— 核对缩放比、有没有被裁、横向页有没有转对。
// 「原文件」：原来的 iframe 直连 PDF，用来看内容细节（字体、缺页）。
const SCALE_TXT = {fit:'适合', noscale:'实际大小', shrink:'缩小过大', custom:'自定义'};
let PV = {name:'', page:1, pages:1, tab:'effect', req:0, obj:'', s:null, i:0};
let PVQ = [];      // 全部预览时的页序列 [{n,p,fi,fn}]，空数组 = 单文件模式
let wheelAcc = 0, wheelLock = 0;   // 滚轮翻页的累计位移与冷却时刻
let lastWheelAt = 0, gestureDone = false;  // 一次连续滑动里是否已经翻过

function pvSummary(s, pages){
  const sc = s.scale === 'custom' ? `自定义 ${s.pct}%` : (SCALE_TXT[s.scale] || '适合');
  const nup = (s.nup && s.nup > 1) ? ` · 每张 ${s.nup} 页` : '';
  return `${s.paper} · ${sc}${nup} · ${s.color ? '彩色' : '黑白'}` + (pages ? ` · ${pages} 页` : '');
}

function openPv(name){
  const f = FILES.find(x=> x.name === name);
  if (!f) return;
  if (f.error) return toast('这份文件无法预览：' + f.detail, true);
  const s = ROWS[name] || {paper:'A4', scale:'fit', pct:100, color:0, nup:1};
  PVQ = [];                            // 单文件模式：清掉上一次「全部预览」的序列
  const nup = s.nup || 1;
  const sheets = Math.ceil((f.pages || 1) / nup);
  PV = {name, page:1, pages:sheets, tab:'effect', req:0, obj:'', s, i:0};
  wheelAcc = 0; wheelLock = 0;        // 换文件了，别带着上一次的滚轮残余
  gestureDone = false; lastWheelAt = 0;
  $('#pvTab').dataset.n = name;
  $('#pvFrame').src = 'about:blank';   // 换文件了，别让上一个的 PDF 留在 iframe 里
  $('#pv').classList.add('show');
  setPvTab('effect');
}

// 「全部预览」：把每个文件的每一页摊平成一条序列，一个窗口从头翻到尾，
// 翻页时按各自那一行的纸张/缩放/色彩渲染，不用一份一份点。
function openPvAll(){
  const list = FILES.filter(f => !f.error && !f.pending);
  if (!list.length) return toast('没有可预览的文件', true);
  PVQ = [];
  list.forEach((f, i) => {
    const s = ROWS[f.name];
    const nup = (s && s.nup) || 1;
    const sheets = Math.ceil((f.pages || 1) / nup);   // 多页拼版：按纸张数摊平
    for (let p = 1; p <= sheets; p++)
      PVQ.push({n: f.name, p, fi: i + 1, fn: list.length});
  });
  const n0 = (ROWS[list[0].name] && ROWS[list[0].name].nup) || 1;
  PV = {name: list[0].name, page: 1, pages: Math.ceil((list[0].pages || 1) / n0),
        tab:'effect', req:0, obj:'', s:null, i: 0};
  wheelAcc = 0; wheelLock = 0;
  gestureDone = false; lastWheelAt = 0;
  $('#pvTab').dataset.n = list[0].name;
  $('#pvFrame').src = 'about:blank';
  $('#pv').classList.add('show');
  setPvTab('effect');
}

// 「拼版预览」：把勾选的文件合并后再多页拼版，预览拼到同一张纸上的效果。
// 需要勾选 ≥2 个文件、且每行的「每页张数」一致（拼版参数不同没法拼一起）。
function openPvMerge(){
  const list = FILES.filter(f => ROWS[f.name].sel && !f.error && !f.pending);
  if (list.length < 2) return toast('拼版预览需要至少勾选 2 个文件', true);
  const nup = ROWS[list[0].name].nup || 1;
  if (nup <= 1) return toast('拼版预览需要每页张数 > 1（先在各行选 2/4/6/9/16 页）', true);
  // 拼版参数必须一致：纸张、每页张数、色彩、缩放都相同才能拼成一份
  const s0 = ROWS[list[0].name];
  const bad = list.find(f => {
    const s = ROWS[f.name];
    return s.paper !== s0.paper || (s.nup||1) !== nup
        || !!s.color !== !!s0.color || s.scale !== s0.scale;
  });
  if (bad) return toast(`「${bad.name}」的纸张/每页张数/色彩/缩放与其它不一致，无法拼成同一张纸，请先统一`, true);
  const totalPages = list.reduce((a, f) => a + (f.pages || 0), 0);
  PVQ = [];
  PV = {multi:true, names:list.map(f=>f.name), nup, page:1,
        pages:Math.ceil(totalPages / nup), tab:'effect', req:0, obj:'', s:s0, i:0};
  wheelAcc = 0; wheelLock = 0;
  gestureDone = false; lastWheelAt = 0;
  $('#pvFrame').src = 'about:blank';
  $('#pv').classList.add('show');
  setPvTab('effect');
}

function setPvTab(tab){
  PV.tab = tab;
  // 跨文件拼版预览没有单一「原文件」，只留「打印效果」这一档
  const rawBtn = $('#pvTabs').querySelector('button[data-tab="raw"]');
  rawBtn.style.display = PV.multi ? 'none' : '';
  if (PV.multi) tab = 'effect';
  for (const b of $('#pvTabs').querySelectorAll('button'))
    b.classList.toggle('on', b.dataset.tab === tab);
  const eff = tab === 'effect';
  $('#pvEffect').style.display = eff ? 'flex' : 'none';
  $('#pvFrame').style.display = eff ? 'none' : 'block';
  if (eff) loadEffect();
  else if ($('#pvFrame').src.indexOf('about:blank') !== -1)
    $('#pvFrame').src = '/pdf/' + encodeURIComponent(PV.name) + '#view=Fit';
}

// 每次翻页向后端要一张「整张纸」的图；响应头带回真实缩放比和纸张尺寸
function loadEffect(){
  if (PV.multi) return loadEffectMulti();
  const it = PVQ[PV.i];                      // 全部预览：当前这一页属于哪个文件
  const name = it ? it.n : PV.name;
  const p = it ? it.p : PV.page;
  const s = ROWS[name] || PV.s || {paper:'A4', scale:'fit', pct:100, color:0, nup:1};
  const f = FILES.find(x => x.name === name);
  const nup = s.nup || 1;
  const pages = Math.ceil(((f && f.pages) || 1) / nup);   // 多页拼版：按纸张数翻页
  const id = ++PV.req;
  // 切到「原文件」时 iframe 得换成当前这份，所以跨越文件时先清掉旧 PDF
  if (PV.name !== name) $('#pvFrame').src = 'about:blank';
  PV.name = name; PV.pages = pages;
  $('#pvTab').dataset.n = name;      // 「新标签打开」跟着当前文件走
  const q = new URLSearchParams({name, paper:s.paper, scale:s.scale,
                                 pct:s.pct, page:p, gray:s.color ? 0 : 1, dpi:130,
                                 nup});
  $('#pvTitle').textContent = PVQ.length ? `全部预览 · ${name}` : name;
  $('#pvMeta').textContent = PVQ.length
    ? `第 ${it.fi}/${it.fn} 个文件 · ${pvSummary(s)}`   // 页码由底部统一显示，这里不重复总页数
    : pvSummary(s, pages);
  const unit = nup > 1 ? '张' : '页';
  $('#pvPage').textContent = PVQ.length
    ? `第 ${PV.i + 1} ${unit} / 共 ${PVQ.length} ${unit}`
    : `第 ${p} ${unit} / 共 ${pages} ${unit}`;
  $('#pvImg').style.opacity = .35;
  $('#pvWarn').textContent = '';
  fetchPvImg('/api/printpreview?' + q, id);
}

// 拉一张「整张纸」的预览图并挂到界面。单文件/全部预览/跨文件拼版三种模式共用，
// 只有请求的 URL 不同。stale 错误（服务是旧版没这个接口）单独处理，退回原文件。
function fetchPvImg(url, id){
  fetch(url).then(async r => {
    if (!r.ok){
      let msg = '渲染失败';
      try { msg = (await r.json()).error || msg; } catch(e){}
      // 404 + not found 只可能是后端还没有这个接口（服务没重启、跑的是旧代码），
      // 不是这份文件的问题，别让用户以为文件坏了。
      if (r.status === 404 && msg === 'not found')
        throw Object.assign(new Error('当前打印服务是旧版本，没有这个预览接口，'
          + '请关掉那个黑窗口重新双击「启动打印系统.bat」'), {stale: true});
      throw new Error(msg);
    }
    return {blob: await r.blob(), pct:+r.headers.get('X-LP-Pct'),
            rot:+r.headers.get('X-LP-Rot'), w:+r.headers.get('X-LP-W'),
            h:+r.headers.get('X-LP-H'), over:r.headers.get('X-LP-Over') === '1'};
  }).then(o => {
    if (id !== PV.req) return;                       // 关掉或翻过页了，丢弃
    if (PV.obj) URL.revokeObjectURL(PV.obj);
    PV.obj = URL.createObjectURL(o.blob);
    const img = $('#pvImg');
    img.src = PV.obj;
    img.style.opacity = 1;
    $('#pvPct').textContent = `${o.pct}%　${o.w}×${o.h}mm` + (o.rot ? '　已旋转90°' : '');
    $('#pvPct').title = '按纸张减去不可打印边距估算（config 里 preview_margin_mm 可调），'
                      + '实际比例由打印机驱动决定';
    $('#pvWarn').textContent = o.over ? '⚠ 内容超出纸面，超出部分会被裁掉' : '';
  }).catch(err => {
    if (id !== PV.req) return;
    $('#pvImg').style.opacity = 1;
    if (err.stale){                                   // 服务是旧版：弹提示并退回原文件
      toast(err.message, true);
      setPvTab('raw');
      return;
    }
    $('#pvWarn').textContent = '⚠ ' + err.message;
  });
}

// 跨文件拼版预览：把勾选的多个文件合并 + nup 拼版后渲染第 PV.page 张纸。
function loadEffectMulti(){
  const s = PV.s || {paper:'A4', color:0};
  const nup = PV.nup || 1;
  const id = ++PV.req;
  $('#pvTitle').textContent = `拼版预览 · ${PV.names.length} 个文件`;
  $('#pvMeta').textContent = `${s.paper} · 每张 ${nup} 页 · ${s.color ? '彩色' : '黑白'}`;
  $('#pvPage').textContent = `第 ${PV.page} 张 / 共 ${PV.pages} 张`;
  $('#pvImg').style.opacity = .35;
  $('#pvWarn').textContent = '';
  const q = new URLSearchParams({names: PV.names.join(','), paper: s.paper,
                                 nup, page: PV.page, gray: s.color ? 0 : 1, dpi:130});
  fetchPvImg('/api/preview-multi?' + q, id);
}

function closePv(){
  PV.req++;                                         // 作废在途请求
  PVQ = [];
  $('#pv').classList.remove('show');
  $('#pvFrame').src = 'about:blank';                // 停掉加载，别让大文件一直占着内存
  if (PV.obj){ URL.revokeObjectURL(PV.obj); PV.obj = ''; }
  $('#pvImg').removeAttribute('src');
}

$('#pv').addEventListener('click', e=>{ if (e.target.id === 'pv') closePv(); });
$('#pvTabs').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]');
  if (b) setPvTab(b.dataset.tab);
});
// 相对翻页，越界就不动（按钮、键盘、滚轮共用一套边界判断）
function pvGo(d){
  if (PV.tab !== 'effect') return;
  const n = PVQ.length || PV.pages;              // 全部预览时总页数跨文件
  const t = (PVQ.length ? PV.i + 1 : PV.page) + d;
  if (t < 1 || t > n) return;
  if (PVQ.length) PV.i = t - 1;
  else PV.page = t;
  loadEffect();
}
$('#pvPrev').addEventListener('click', ()=> pvGo(-1));
$('#pvNext').addEventListener('click', ()=> pvGo(1));

// 滚轮换页：只作用于「打印效果」（原文件里滚轮归浏览器阅读器自己管）。
// 难点是「一次滑动 ≠ 一个事件」：触控板一次轻划会连发几十个 wheel，惯性尾巴能拖半秒。
// 所以按手势收口 —— 同一次连续滑动（事件间隔 < GESTURE_GAP）里最多翻一页，
// 手停了才算这次手势结束。鼠标滚轮一格通常 ≥90px，单独走「立即翻页」分支。
const WHEEL_STEP = 50;     // 触控板：累计到这么多像素才算一次翻页意图
const WHEEL_MOUSE = 90;    // 一次 wheel 就有这么大 → 认定是鼠标滚轮的一格
const WHEEL_COOL = 220;    // 触控板翻页后的冷却，吃掉惯性尾巴
const WHEEL_COOL_M = 120;  // 鼠标的冷却短一些，连滚可以连着翻
const GESTURE_GAP = 160;   // 事件间隔超过这个就算新手势
$('#pvEffect').addEventListener('wheel', e => {
  if (PV.tab !== 'effect' || (PVQ.length || PV.pages) < 2) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // 横向滑动不翻页
  e.preventDefault();                                     // 别让背景跟着滚
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  const d = e.deltaY * unit;
  const now = performance.now();
  if (now - lastWheelAt > GESTURE_GAP) gestureDone = false;  // 停顿够了，新手势
  lastWheelAt = now;
  if (now < wheelLock) return;                               // 冷却期：吞掉惯性
  if (Math.abs(d) >= WHEEL_MOUSE){                           // 鼠标滚轮：一格一页
    wheelAcc = 0; gestureDone = true;
    wheelLock = now + WHEEL_COOL_M;
    pvGo(Math.sign(d));
    return;
  }
  if (gestureDone) return;                                   // 本次滑动已经翻过了
  wheelAcc += d;
  if (Math.abs(wheelAcc) < WHEEL_STEP) return;
  const dir = wheelAcc > 0 ? 1 : -1;                         // 向下滚 = 下一页
  wheelAcc = 0; gestureDone = true;
  wheelLock = now + WHEEL_COOL;
  pvGo(dir);
}, {passive:false});

$('#pvTab').addEventListener('click', e=>
  window.open('/pdf/' + encodeURIComponent(e.currentTarget.dataset.n) + '#view=Fit', '_blank'));
document.addEventListener('keydown', e=>{
  if (!$('#pv').classList.contains('show')) return;
  if (e.key === 'Escape') return closePv();
  if (PV.tab !== 'effect') return;
  if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp'){
    pvGo(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown'){
    pvGo(1);
  }
});

function toggleAll(v){
  for (const f of FILES) ROWS[f.name].sel = v;
  lastSel = -1;              // 全选/全不选后清掉连选锚点，避免旧锚点造成意外区间
  render();
}

function applyAll(){
  DEF = barValues();
  for (const f of FILES){
    const s = ROWS[f.name];
    s.printer = DEF.printer; s.copies = DEF.copies;
    s.paper = DEF.paper; s.duplex = DEF.duplex;
    s.scale = DEF.scale; s.pct = DEF.pct;
    s.nup = DEF.nup;
    s.color = DEF.color;
  }
  render();
  toast('已应用默认设置到全部文件');
}

// 「应用到选中的」：只把默认设置套用到勾选的文件，没勾选的不动。
function applySelected(){
  const sel = FILES.filter(f => ROWS[f.name].sel);
  if (!sel.length) return toast('没有勾选文件，请先在列表里勾选', true);
  DEF = barValues();
  for (const f of sel){
    const s = ROWS[f.name];
    s.printer = DEF.printer; s.copies = DEF.copies;
    s.paper = DEF.paper; s.duplex = DEF.duplex;
    s.scale = DEF.scale; s.pct = DEF.pct;
    s.nup = DEF.nup;
    s.color = DEF.color;
  }
  render();
  toast(`已应用默认设置到 ${sel.length} 个勾选文件`);
}

async function send(names, merge){
  const jobs = names.map(n=>{
    const s = ROWS[n];
    return {name:n, printer:s.printer, copies:s.copies,
            color: !!s.color, paper:s.paper, duplex:s.duplex,
            scale: s.scale, scale_pct: s.pct, pages_spec: s.range || '',
            nup: s.nup || 1};
  });
  try{
    const r = await fetch('/api/print', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({jobs, merge: !!merge})}).then(r=>r.json());
    if (r.error) return toast('发出失败：' + r.error, true);
    // 后端立刻返回（转换/合并都在后台做），先把「排队中」写进表格，别等下一轮轮询
    for (const q of r.queued || []){
      const st = {id:q.id, name:q.name, names:q.names || [q.name], state:q.state || '排队中'};
      LASTJOB[q.name] = st;
      for (const n of st.names) LASTJOB[n] = st;
    }
    ACTIVE = Math.max(ACTIVE, (r.queued || []).length);
    if (FILES.length) paintStatus();
    toast(merge ? `已合并为 ${r.queued.length} 个打印任务（共 ${names.length} 份文件）`
                : `已发出 ${r.queued.length} 个打印任务`);
    poll();
  }catch(err){ toast('发出失败：' + err, true); }
}

function printAll(merge){
  const names = FILES.filter(f=>ROWS[f.name].sel).map(f=>f.name);
  if (!names.length) return toast('没有勾选文件', true);
  send(names, merge);
}

// 清空队列：删勾选的源文件（进回收站）+ 它们的缓存 PDF + 合并临时文件。
// 删除清单先摊给用户看，热文件夹里不是打印件的文件后端一个字不碰。
async function clearQueue(){
  const names = FILES.filter(f=>ROWS[f.name].sel).map(f=>f.name);
  if (!names.length) return toast('没有勾选文件', true);
  const list = names.length > 15
    ? names.slice(0, 15).join('\n') + `\n……共 ${names.length} 个`
    : names.join('\n');
  if (!confirm(`从热文件夹删除这 ${names.length} 个文件？\n\n${list}\n\n` +
               `连同它们的缓存 PDF、合并临时文件一起清掉。\n` +
               `源文件进回收站，可还原。`)) return;
  try{
    const r = await fetch('/api/clear', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({names})}).then(r=>r.json());
    if (r.error) return toast('清空失败：' + r.error, true);
    toast(`已删 ${r.removed} 个文件，清掉 ${r.cache} 个缓存 PDF`
          + (r.merged ? `、${r.merged} 个合并临时文件` : '')
          + (r.failed && r.failed.length ? `；${r.failed.length} 个删不掉（被占用？）` : ''));
    await refresh(true);
  }catch(e){ toast('清空失败：' + e, true); }
}

async function openFolder(){ await fetch('/api/open-folder'); }

async function pickFolder(){
  toast('请在弹出的窗口里选择文件夹…');
  try{
    const r = await fetch('/api/pick-folder').then(r=>r.json());
    if (r.error) return toast('切换失败：' + r.error, true);
    if (r.canceled) return toast('已取消');
    ROWS = {}; SIG = '';          // 换目录了，每行的参数重新初始化
    await refresh(true);
    toast('热文件夹已切到 ' + r.folder);
  }catch(e){ toast('切换失败：' + e, true); }
}

// 轮询：有任务在跑就 0.6 秒一次（状态变得快），闲下来降到 2.5 秒省资源。
// ACTIVE 由后端返回的任务状态算出来，不用前端自己猜。
let ACTIVE = 0;
async function poll(){
  try{
    const r = await fetch('/api/status').then(r=>r.json());
    const map = {};
    let finished = false;
    for (const j of r.jobs){
      if (PREV[j.id] !== j.state){        // 有任务刚完成就去刷一下账单
        if (j.state === '完成') finished = true;
        PREV[j.id] = j.state;
      }
    }
    // jobs 按 id 倒序，先写老的后写新的 => 每行保留最新状态
    for (const j of r.jobs.slice().reverse()){
      if (j.names && j.names.length) for (const n of j.names) map[n] = j;
      else map[j.name] = j;
    }
    LASTJOB = map;
    ACTIVE = r.jobs.filter(j=>j.state==='排队中'||j.state==='准备中'||j.state==='打印中').length;
    if (FILES.length) paintStatus();
    if (finished) loadLog();
  }catch(e){}
}
function pollLoop(){
  setTimeout(async ()=>{ await poll(); pollLoop(); }, ACTIVE ? 600 : 2500);
}

// 刷新：有文件正在转 PDF 就 1.2 秒一次（页数一出来马上显示），否则 4 秒
function refreshLoop(){
  const gap = FILES.some(f=>f.pending) ? 1200 : 4000;
  setTimeout(async ()=>{ await refresh(); refreshLoop(); }, gap);
}

refresh();
loadLog();
refreshLoop();
pollLoop();
setInterval(loadLog, 60000);

</script>
